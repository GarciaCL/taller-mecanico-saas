<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda y Reservas - Mi Taller Online</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet" />
    <style>
        body { background-color: #f8f9fa; }
        .fc-event { cursor: pointer; }
    </style>
</head>
<body>

<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
        <div>
            <a href="/" class="btn btn-outline-secondary me-2"><i class="bi bi-arrow-left"></i> Volver al Panel</a>
            <h3 class="d-inline-block mb-0"><i class="bi bi-calendar-event text-primary me-2"></i>Agenda y Reservas</h3>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevaReserva">
            <i class="bi bi-plus-lg me-1"></i> Nueva Reserva
        </button>
    </div>

    <div class="card shadow-sm p-4 bg-white">
        <div id="calendar"></div>
    </div>
</div>

<!-- Modal para Nueva Reserva -->
<div class="modal fade" id="modalNuevaReserva" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><i class="bi bi-clock-history me-2"></i>Agendar Cupo de Ingreso</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formReserva">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Patente del Vehículo *</label>
                        <input type="text" class="form-control text-uppercase" id="res_patente" required placeholder="ej: AB123CD">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nombre del Cliente *</label>
                        <input type="text" class="form-control" id="res_cliente" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="res_telefono" placeholder="+56912345678">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Modelo / Vehículo</label>
                            <input type="text" class="form-control" id="res_modelo" placeholder="ej: Toyota Yaris">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Servicio Requerido</label>
                        <textarea class="form-control" id="res_servicio" rows="2" placeholder="Mantención, revisión de frenos..."></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha y Hora Inicio *</label>
                            <input type="datetime-local" class="form-control" id="res_inicio" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha y Hora Fin *</label>
                            <input type="datetime-local" class="form-control" id="res_fin" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success"><i class="bi bi-check-lg me-1"></i> Guardar Reserva</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- FullCalendar JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        locale: 'es',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek'
        },
        buttonText: {
            today:    'Hoy',
            month:    'Mes',
            week:     'Semana',
            day:      'Día',
            list:     'Lista'
        },
        events: '/api/reservas',
        eventClick: function(info) {
            var p = info.event.extendedProps;
            alert('Reserva: ' + info.event.title + '\nServicio: ' + (p.servicio || 'N/A') + '\nTeléfono: ' + (p.telefono || 'N/A'));
        }
    });
    calendar.render();

    document.getElementById('formReserva').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var datos = {
            patente: document.getElementById('res_patente').value,
            cliente_nombre: document.getElementById('res_cliente').value,
            cliente_telefono: document.getElementById('res_telefono').value,
            vehiculo_modelo: document.getElementById('res_modelo').value,
            servicio_requerido: document.getElementById('res_servicio').value,
            fecha_inicio: document.getElementById('res_inicio').value,
            fecha_fin: document.getElementById('res_fin').value
        };

        fetch('/api/reservas/crear', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(datos)
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                var modal = bootstrap.Modal.getInstance(document.getElementById('modalNuevaReserva'));
                modal.hide();
                document.getElementById('formReserva').reset();
                calendar.refetchEvents();
            } else {
                alert('Error al guardar: ' + (data.error || 'Intente nuevamente'));
            }
        });
    });
});
</script>
</body>
</html>
