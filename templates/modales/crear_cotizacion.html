<div id="modal-crear-cotizacion" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4 overflow-y-auto">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg p-6 rounded-2xl shadow-2xl space-y-4 my-8">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-white flex items-center gap-2">📑 Armar Nueva Cotización / Presupuesto</h3>
            <button type="button" onclick="document.getElementById('modal-crear-cotizacion').classList.add('hidden')" class="text-slate-400 hover:text-white font-bold text-lg">✕</button>
        </div>

        <form action="/crear_cotizacion" method="POST" class="space-y-3 text-xs">
            <!-- PATENTE, MARCA Y MODELO -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Patente / VIN</label>
                    <input type="text" name="patente" placeholder="Ej: AA123BB" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono font-bold uppercase focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Marca</label>
                    <select id="select-marca-cot" name="marca" onchange="evaluarNuevaMarcaCot()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                        <option value="">Seleccionar Marca...</option>
                        {% for m in marcas.keys() %}
                        <option value="{{ m }}">{{ m }}</option>
                        {% endfor %}
                        <option value="OTRA">+ Agregar Nueva Marca...</option>
                    </select>
                    <input type="text" id="input-marca-nueva-cot" name="marca_input" placeholder="Escribe la Marca..." class="hidden mt-1 w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
                </div>

                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Modelo</label>
                    <input type="text" name="modelo_input" placeholder="Ej: Qashqai / Yaris" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <!-- DATOS DEL CLIENTE -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Nombre del Cliente</label>
                    <input type="text" name="cliente" placeholder="Ej: Juan Pérez" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1 font-semibold">Teléfono WhatsApp</label>
                    <input type="text" name="telefono" placeholder="+56912345678" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <!-- DETALLE / SÍNTOMAS -->
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">Trabajos Solicitados / Presupuesto</label>
                <textarea name="sintomas" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500" placeholder="Afinamiento completo, cambio de aceite 5W30, pastillas de freno..."></textarea>
            </div>

            <div class="pt-2 flex gap-2">
                <button type="button" onclick="document.getElementById('modal-crear-cotizacion').classList.add('hidden')" class="w-1/2 bg-slate-800 text-slate-300 font-semibold py-2.5 rounded-xl">Cancelar</button>
                <button type="submit" class="w-1/2 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 rounded-xl shadow-lg shadow-amber-600/20 flex items-center justify-center gap-1">
                    💾 Generar Presupuesto
                </button>
            </div>
        </form>
    </div>
</div>
