<div id="modal-excel" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-xl p-6 rounded-2xl shadow-2xl space-y-4">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-white flex items-center gap-2">📊 Carga Masiva desde Excel o CSV</h3>
            <button type="button" onclick="document.getElementById('modal-excel').classList.add('hidden')" class="text-slate-400 hover:text-white">✕</button>
        </div>

        <div class="space-y-3">
            <p class="text-xs text-slate-400">Selecciona tu archivo de inventario en formato .XLSX, .XLS o .CSV para importar los repuestos en lote.</p>
            <input type="file" id="archivo-excel-input" accept=".xlsx, .xls, .csv" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-300">
            <div id="vista-previa-excel" class="hidden max-h-40 overflow-y-auto bg-slate-950 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-300"></div>
        </div>

        <div class="flex gap-2 pt-2">
            <button type="button" onclick="document.getElementById('modal-excel').classList.add('hidden')" class="w-1/2 bg-slate-800 text-slate-300 py-2.5 rounded-xl text-xs font-semibold">Cancelar</button>
            <button type="button" onclick="procesarCargaMasivaExcel()" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1 shadow-lg shadow-emerald-600/20">
                🚀 Confirmar e Importar
            </button>
        </div>
    </div>
</div>
