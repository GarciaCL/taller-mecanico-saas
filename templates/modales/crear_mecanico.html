<div id="modal-crear-mecanico" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4 shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
            <h3 class="text-sm font-bold text-white flex items-center gap-2">👨‍🔧 Registrar Nuevo Mecánico</h3>
            <button type="button" onclick="cerrarModalMecanico()" class="text-slate-400 hover:text-white font-bold">✕</button>
        </div>

        <form id="form-crear-mecanico-ajax" class="space-y-3 text-xs">
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">Nombre del Mecánico / Técnico</label>
                <input type="text" id="mec-nombre" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-slate-400 mb-1 font-semibold">Especialidad</label>
                <input type="text" id="mec-especialidad" placeholder="Ej: Electromecánico, Frenos" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
            </div>

            <div class="pt-2 flex justify-end gap-2">
                <button type="button" onclick="cerrarModalMecanico()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl font-semibold">Cancelar</button>
                <button type="button" onclick="guardarMecanicoAjax()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-bold shadow-lg shadow-blue-600/20">Guardar Mecánico</button>
            </div>
        </form>
    </div>
</div>
